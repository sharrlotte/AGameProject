[workspace]
resolver = "3"
members = [
   "crates/core", "crates/net", "crates/platform",
   "crates/server", "crates/ui",
]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
