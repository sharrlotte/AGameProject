[package]
name = "core"
version = "0.1.0"
edition = "2024"

[features]
# Enable dynamic linking for fast incremental dev rebuilds (use `cargo dev` or `--features dev`).
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.17.3", features = ["dynamic_linking", "serialize"] }
bevy-inspector-egui = { version = "0.35" }
bevy_rapier2d = { version = "0.32.0" }
bevy_hanabi = "0.17"
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rand = "0.9"
uuid = { version = "1", features = ["v7"] }
