[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17.3", default-features = false, features = [
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_text",
    "bevy_image",
    "bevy_post_process",
    "png",
    "bevy_log",
    "multi_threaded",
    "std",
    "tonemapping_luts"
] }
bevy-inspector-egui = { version = "0.35" }
bevy_rapier2d = { version = "0.32.0" }
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

