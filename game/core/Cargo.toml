[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["serialize"] }
bevy-inspector-egui = { version = "0.38.0", optional = true }
bevy_brp_extras = { version = "0.23.0", optional = true }
bevy_rapier2d = { version = "0.37.0" }
bevy_hanabi = "0.20.0"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
rand = "0.10.3"
uuid = { version = "1.29.2", features = ["v7"] }

[features]
dev = ["bevy/bevy_remote", "bevy/file_watcher", "dep:bevy_brp_extras", "dep:bevy-inspector-egui"]
