[package]
name = "core"
version = "0.1.0"
edition = "2024"

[features]
# Enable dynamic linking for fast incremental dev rebuilds (use `cargo dev` or `--features dev`).
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.20.0", default-features = false,  features = ["dynamic_linking", "serialize"] }
bevy-inspector-egui = { version = "0.38" }
bevy_rapier3d = { version = "0.37.0" }
bevy_hanabi = "0.20"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand = "0.10"
uuid = { version = "1", features = ["v7"] }
