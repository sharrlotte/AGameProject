[workspace]
resolver = "3"
members = [
   "core"
]

[workspace.lints.rust]
unused_variables = "deny"
unused_imports = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "debuginfo"

[profile.release-native]
inherits = "release"
opt-level = 3
strip = "none"
